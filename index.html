<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruben Rouwhof</title>
  <meta name="description" content="Ruben Rouwhof — ontwerp en ontwikkeling van digitale diensten.">
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1c1c1a;
      --muted: #5c5c57;
      --accent: #1f5f8b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --text: #ecece8;
        --muted: #a8a8a2;
        --accent: #8cc4ec;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--text);
      font: 1.125rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 36rem; }
    h1 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 .5rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Ruben Rouwhof</h1>
    <p>Ik ontwerp en bouw digitale diensten.</p>
    <p>Mail me via <a href="mailto:ruben@rouwhof.com">ruben@rouwhof.com</a>.</p>
  </main>
</body>
</html>
